services:
  wordpress:
    image: wordpress:latest
    container_name: wp
    ports:
      - '0.0.0.0:80:80'
    restart: always
    # Core comes from the image; only our content is mounted.
    # wp-config.php is generated by the image from the env vars below.
    volumes:
      - ./wp-content:/var/www/html/wp-content
      - ./.htaccess:/var/www/html/.htaccess
    env_file: .env
    environment:
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('FS_METHOD', 'direct');
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && strpos($$_SERVER['HTTP_X_FORWARDED_PROTO'], 'https') !== false) {
          $$_SERVER['HTTPS'] = 'on';
        }
